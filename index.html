<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B8F4F">

  <title>سوبرماركت الكينج | كل احتياجاتك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --green: #1B8F4F;
      --green-dark: #0F5132;
      --green-deep: #123e2a;
      --gold: #D9A920;
      --cream: #F8FAF7;
      --white: #ffffff;
      --muted: #64756b;
      --line: #e3ebe4;
      --soft-green: #eaf5ed;
      --shadow: 0 12px 34px rgba(15, 81, 50, .09);
      --header-height: 70px;
      --radius-lg: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 150px; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--cream);
      color: var(--green-dark);
      font-family: "Cairo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(217, 169, 32, .72);
      outline-offset: 3px;
    }
    .hidden { display: none !important; }
    .site-width { width: min(100% - 32px, 1240px); margin-inline: auto; }
    .topbar {
      position: sticky;
      z-index: 50;
      top: 0;
      min-height: var(--header-height);
      background: rgba(248, 250, 247, .94);
      border-bottom: 1px solid rgba(15, 81, 50, .08);
      backdrop-filter: blur(14px);
    }
    .topbar-inner { min-height: var(--header-height); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .brand-mark { width: 47px; height: 48px; display: block; }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-small { font-size: 11px; font-weight: 600; color: #527161; }
    .brand-name { color: var(--green-dark); font-size: 22px; font-weight: 900; letter-spacing: -.7px; }
    .user-menu-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
    .user-name {
      max-width: 116px;
      overflow: hidden;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .menu-toggle, .icon-button {
      display: inline-grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .menu-toggle:hover, .icon-button:hover { transform: translateY(-2px); border-color: #bbd9c4; }
    .menu-pop {
      position: absolute;
      z-index: 80;
      top: calc(100% + 10px);
      left: 0;
      width: 210px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .menu-pop button { width: 100%; min-height: 44px; padding: 9px 12px; border: 0; border-radius: 11px; background: transparent; text-align: right; cursor: pointer; }
    .menu-pop button:hover { background: var(--soft-green); }
    .desktop-links { display: none; align-items: center; gap: 5px; }
    .desktop-links a { padding: 9px 13px; border-radius: 12px; color: #506b5b; font-size: 13px; font-weight: 800; }
    .desktop-links a.active, .desktop-links a:hover { background: var(--soft-green); color: var(--green-dark); }
    #searchMount { position: sticky; z-index: 40; top: var(--header-height); background: rgba(248, 250, 247, .96); }
    .search-area { padding-block: 11px; }
    .search-box { position: relative; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 15px; border: 1px solid #dce8de; border-radius: 17px; background: #fff; box-shadow: 0 5px 18px rgba(15, 81, 50, .045); }
    .search-box svg { flex: 0 0 auto; color: #718778; }
    .search-box input { width: 100%; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; color: var(--green-dark); }
    .search-box input::placeholder { color: #819187; }
    .suggestions { position: absolute; z-index: 60; top: calc(100% + 8px); inset-inline: 0; max-height: 300px; overflow-y: auto; padding: 7px; border: 1px solid var(--line); border-radius: 17px; background: #fff; box-shadow: var(--shadow); }
    .suggestion-row { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 11px; background: transparent; text-align: right; cursor: pointer; }
    .suggestion-row:hover { background: var(--soft-green); }
    main { min-height: 55vh; }
    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 355px;
      overflow: hidden;
      place-items: center;
      padding: 42px 20px 50px;
      background: var(--green);
      color: #fff;
      text-align: center;
    }
    .hero::before, .hero::after { position: absolute; z-index: -1; content: ""; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; }
    .hero::before { width: 390px; height: 390px; top: -245px; right: -110px; }
    .hero::after { width: 480px; height: 480px; bottom: -370px; left: -95px; }
    .hero-inner { position: relative; z-index: 1; width: min(100%, 780px); }
    .hero-kicker { margin: 0 0 1px; color: #f4dd91; font-size: clamp(14px, 2.2vw, 19px); font-weight: 800; letter-spacing: .3px; }
    .hero h1 { margin: 0; color: #fff; font-size: clamp(36px, 8vw, 74px); font-weight: 900; line-height: 1.18; letter-spacing: -1.8px; text-shadow: 0 4px 0 rgba(0,0,0,.06); }
    .hero h1 span { color: #ffe08a; }
    .hero-copy { max-width: 620px; margin: 13px auto 23px; color: rgba(255,255,255,.91); font-size: clamp(14px, 2.6vw, 18px); line-height: 1.9; }
    .hero-cta, .button-primary, .button-secondary, .button-outline, .button-quiet, .button-gold {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .hero-cta { min-width: 160px; background: var(--gold); color: #243b23; box-shadow: 0 7px 0 rgba(133, 98, 0, .14); }
    .hero-cta:hover, .button-primary:hover, .button-gold:hover { transform: translateY(-2px); box-shadow: 0 9px 18px rgba(15,81,50,.16); }
    .hero-deco { position: absolute; z-index: 0; display: grid; width: 66px; height: 66px; place-items: center; border: 1px solid rgba(255,255,255,.2); border-radius: 23px; background: rgba(255,255,255,.12); font-size: 35px; animation: drift 5.8s ease-in-out infinite; }
    .hero-deco.one { top: 18%; right: max(5%, calc((100vw - 1160px) / 2)); animation-delay: -.8s; }
    .hero-deco.two { bottom: 14%; right: 13%; width: 58px; height: 58px; font-size: 31px; animation-delay: -2.2s; }
    .hero-deco.three { top: 19%; left: max(5%, calc((100vw - 1160px) / 2)); width: 72px; height: 72px; font-size: 39px; animation-delay: -1.5s; }
    .hero-deco.four { bottom: 13%; left: 12%; width: 58px; height: 58px; font-size: 30px; animation-delay: -3s; }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    .section { padding-block: 34px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .section-title { margin: 0; color: var(--green-dark); font-size: clamp(22px, 4vw, 30px); font-weight: 900; line-height: 1.35; }
    .section-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .feature-strip { display: grid; grid-template-columns: 1fr; gap: 0; padding-block: 17px; border-bottom: 1px solid var(--line); }
    .feature-line { display: flex; align-items: center; gap: 13px; min-height: 62px; border-bottom: 1px solid var(--line); }
    .feature-line:last-child { border-bottom: 0; }
    .feature-icon { display: grid; width: 43px; height: 43px; flex: 0 0 43px; place-items: center; border-radius: 15px; background: #edf6ed; font-size: 22px; }
    .feature-line strong { display: block; font-size: 15px; font-weight: 900; }
    .feature-line span:last-child { display: block; color: var(--muted); font-size: 12px; }
    .category-row { display: flex; gap: 9px; overflow-x: auto; padding: 3px 1px 12px; scrollbar-width: thin; scrollbar-color: #b5d2bc transparent; }
    .category-chip { display: inline-flex; min-height: 44px; flex: 0 0 auto; align-items: center; gap: 7px; padding: 7px 15px; border: 1px solid #dfebe1; border-radius: 999px; background: #fff; color: #3f6250; font-size: 13px; font-weight: 800; cursor: pointer; transition: .2s ease; }
    .category-chip:hover, .category-chip.active { border-color: var(--green); background: var(--green); color: #fff; }
    .category-chip .cat-icon { font-size: 17px; }
    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product-card { min-width: 0; overflow: hidden; border: 1px solid #e5ece5; border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(15,81,50,.045); transition: transform .25s ease, box-shadow .25s ease; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 13px 27px rgba(15,81,50,.11); }
    .product-visual { position: relative; display: grid; height: 124px; overflow: hidden; place-items: center; background: linear-gradient(145deg, var(--tile-a), var(--tile-b)); }
    .product-visual::before { position: absolute; width: 105px; height: 105px; border: 1px solid rgba(255,255,255,.68); border-radius: 50%; content: ""; }
    .product-visual img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    .product-emoji { position: relative; z-index: 1; font-size: 53px; filter: drop-shadow(0 8px 7px rgba(42,64,39,.13)); transition: transform .3s ease; }
    .product-card:hover .product-emoji { transform: scale(1.08) rotate(-4deg); }
    .popular-badge { position: absolute; z-index: 2; top: 8px; right: 8px; padding: 4px 8px; border-radius: 999px; background: var(--gold); color: #392d08; font-size: 10px; font-weight: 900; }
    .product-info { padding: 11px 11px 12px; }
    .product-name { min-height: 26px; margin: 0; overflow: hidden; color: var(--green-dark); font-size: 14px; font-weight: 900; line-height: 1.65; text-overflow: ellipsis; white-space: nowrap; }
    .product-size { display: block; min-height: 20px; color: #849087; font-size: 11px; }
    .product-tools { display: flex; flex-direction: column; align-items: stretch; gap: 7px; margin-top: 9px; }
    .qty-stepper { display: inline-flex; min-height: 46px; align-items: center; justify-content: space-between; gap: 2px; padding: 3px; border: 1px solid #e2ece3; border-radius: 999px; background: #f9fcf8; }
    .qty-stepper button { display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border: 0; border-radius: 50%; background: #e9f4eb; color: var(--green-dark); font-size: 19px; font-weight: 900; cursor: pointer; }
    .qty-stepper button:hover { background: #d6eddb; }
    .qty-stepper output { min-width: 18px; text-align: center; font-size: 13px; font-weight: 900; }
    .add-button { display: inline-flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; gap: 5px; padding: 7px 8px; border: 0; border-radius: 999px; background: var(--green); color: #fff; font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .add-button:hover { background: var(--green-dark); }
    .empty-results { padding: 32px 18px; border: 1px dashed #c9ddce; border-radius: 20px; background: #fff; text-align: center; }
    .empty-results .empty-icon { font-size: 42px; }
    .empty-results h3 { margin: 9px 0 5px; font-size: 20px; font-weight: 900; }
    .empty-results p { margin: 0 0 15px; color: var(--muted); }
    .empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .button-primary { background: var(--green); color: #fff; box-shadow: 0 6px 15px rgba(27,143,79,.15); }
    .button-secondary { border: 1px solid #cfe3d2; background: #edf6ef; color: var(--green-dark); }
    .button-secondary:hover, .button-outline:hover, .button-quiet:hover { background: #e1f0e4; }
    .button-outline { border: 1px solid #c9ddce; background: #fff; color: var(--green-dark); }
    .button-quiet { min-height: 42px; padding: 8px 14px; background: transparent; color: var(--green-dark); }
    .button-gold { background: var(--gold); color: #342a0d; }
    .button-primary:disabled, .button-gold:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .content-wrap { padding-bottom: 35px; }
    .login-wrap { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; padding-block: 15px 45px; }
    .login-intro { padding-block: 7px; }
    .login-intro h2 { max-width: 560px; margin: 0 0 9px; font-size: clamp(26px, 5vw, 38px); font-weight: 900; line-height: 1.35; }
    .login-intro p { max-width: 580px; margin: 0; color: var(--muted); line-height: 1.9; }
    .login-form, .interactive-panel { padding: 21px; border: 1px solid #e1ebe2; border-radius: 22px; background: #fff; box-shadow: var(--shadow); }
    .login-form h3 { margin: 0 0 14px; font-size: 20px; font-weight: 900; }
    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field label { color: var(--green-dark); font-size: 13px; font-weight: 800; }
    .field input, .field textarea, .text-input { width: 100%; min-height: 48px; padding: 10px 13px; border: 1px solid #dfe8e0; border-radius: 13px; background: #fbfdfb; color: var(--green-dark); outline: 0; }
    .field textarea { min-height: 88px; resize: vertical; }
    .field input:focus, .field textarea:focus, .text-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(27,143,79,.1); }
    .landing-cats { padding-block: 7px 22px; }
    .landing-cats .category-row { padding-bottom: 9px; }
    .page-heading { padding: 27px 0 8px; }
    .page-heading h1 { margin: 0; font-size: clamp(27px, 5vw, 38px); font-weight: 900; }
    .page-heading p { margin: 5px 0 0; color: var(--muted); line-height: 1.8; }
    .best-topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-block: 12px 22px; }
    .best-grid { padding-bottom: 30px; }
    .empty-state { display: grid; min-height: 300px; place-content: center; padding: 30px; text-align: center; }
    .empty-state .empty-icon { font-size: 65px; }
    .empty-state h2 { margin: 10px 0 5px; font-size: 24px; font-weight: 900; }
    .empty-state p { max-width: 450px; margin: 0 auto 17px; color: var(--muted); line-height: 1.8; }
    .cart-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 7px 17px; }
    .cart-count { color: var(--muted); font-size: 13px; font-weight: 800; }
    .cart-list { overflow: hidden; border: 1px solid #e0e9e1; border-radius: 20px; background: #fff; }
    .cart-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 15px; border-bottom: 1px solid #edf1ed; }
    .cart-row:last-child { border-bottom: 0; }
    .cart-row-main { min-width: 0; }
    .cart-row-name { margin: 0; overflow-wrap: anywhere; font-weight: 900; line-height: 1.55; }
    .cart-row-meta { margin-top: 3px; color: #7d8c82; font-size: 12px; }
    .cart-row-actions { display: flex; align-items: center; gap: 7px; }
    .remove-button { display: grid; width: 44px; height: 44px; flex: 0 0 44px; place-items: center; border: 1px solid #f0dada; border-radius: 13px; background: #fff8f8; color: #aa4040; cursor: pointer; }
    .special-badge { display: inline-flex; min-height: 25px; align-items: center; padding: 3px 9px; border-radius: 999px; background: #fff3c7; color: #725506; font-size: 11px; font-weight: 900; }
    .special-edit { display: grid; grid-column: 1 / -1; gap: 8px; margin-top: 4px; }
    .special-edit input { min-height: 42px; padding: 8px 11px; border: 1px solid #e4e9de; border-radius: 12px; background: #fcfdf9; }
    .cart-actions-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 0; }
    .special-form { margin: 4px 0 16px; padding: 17px; border: 1px dashed #c9ddce; border-radius: 18px; background: #f3f8f2; }
    .special-form h3 { margin: 0 0 12px; font-size: 17px; font-weight: 900; }
    .special-form-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
    .special-form-grid .field { margin: 0; }
    .checkout-grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding-block: 11px 32px; }
    .checkout-section { padding: 17px; border: 1px solid #e1ebe2; border-radius: 19px; background: #fff; }
    .checkout-section h3 { margin: 0 0 11px; font-size: 17px; font-weight: 900; }
    .option-list { display: grid; grid-template-columns: 1fr; gap: 9px; }
    .option-card { display: flex; min-height: 58px; align-items: center; gap: 11px; padding: 10px 13px; border: 1px solid #e1e9e2; border-radius: 15px; background: #fff; text-align: right; cursor: pointer; transition: .2s ease; }
    .option-card:hover, .option-card.selected { border-color: var(--green); background: #f0f8f1; }
    .option-dot { display: grid; width: 21px; height: 21px; flex: 0 0 21px; place-items: center; border: 2px solid #b9c9bc; border-radius: 50%; }
    .option-card.selected .option-dot { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 4px #fff; }
    .option-text strong { display: block; font-size: 13px; font-weight: 900; }
    .option-text small { color: var(--muted); font-size: 11px; }
    .discount-block { margin-top: 16px; padding: 16px; border: 1px solid #ecd98d; border-radius: 18px; background: #fff9e5; }
    .discount-title { display: flex; align-items: center; gap: 8px; font-weight: 900; }
    .discount-copy { margin: 4px 0 11px; color: #71643b; font-size: 12px; line-height: 1.75; }
    .discount-form { display: flex; flex-wrap: wrap; gap: 8px; }

    .countdown { display: inline-block; color: #746322; font-variant-numeric: tabular-nums; font-weight: 900; direction: ltr; }
    .checkout-submit { width: 100%; min-height: 57px; margin-top: 15px; border-radius: 18px; font-size: 16px; }
    .bot-panel { overflow: hidden; border: 1px solid #dfe9e0; border-radius: 22px; background: #fff; box-shadow: var(--shadow); }
    .bot-head { display: flex; align-items: center; gap: 11px; padding: 15px 17px; border-bottom: 1px solid #e8eee8; background: #fbfdfb; }

    .chat-message { max-width: min(88%, 560px); padding: 11px 13px; border-radius: 17px; font-size: 14px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.bot { align-self: flex-start; border: 1px solid #e7eee7; border-top-right-radius: 5px; background: #fff; color: var(--green-dark); }
    .chat-message.user { align-self: flex-end; border-top-left-radius: 5px; background: var(--green); color: #fff; }
    .chat-choices { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

    .chat-choice:hover { border-color: var(--green); background: #e5f3e7; }

    .typing-indicator i:nth-child(2) { animation-delay: .15s; }.typing-indicator i:nth-child(3) { animation-delay: .3s; }

    const normalizeDigits = value => String(value).replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit))).replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)));
    function normalizeArabic(value) {
      return normalizeDigits(value)
        .toLocaleLowerCase("ar")
        .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
        .replace(/[أإآٱ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/[^\p{L}\p{N}\s-]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function addRegular(productId, amount = 1, source = null, silent = false) {
      const item = getProduct(productId);
      if (!item) return;
      const qty = Math.max(1, Math.floor(Number(amount) || 1));
      const existing = cart.find(row => !row.special && row.productId === item.id);
      if (existing) existing.qty += qty;
      else cart.push({ lineId: lineId(), productId: item.id, name: item.name, qty, special: false, note: "" });
      saveCart(); animateFlight(source); if (!silent) toast(`تمت إضافة ${item.name} للعربة`);
    }
    function addSpecial(name, amount = 1, note = "", source = null, silent = false) {
      const clean = String(name || "").trim().replace(/\s+/g, " ");
      if (!clean) { toast("اكتب اسم الطلب الخاص الأول", true); return false; }
      const qty = Math.max(1, Math.floor(Number(normalizeDigits(amount)) || 1));
      const key = normalizeArabic(clean);
      const existing = cart.find(row => row.special && normalizeArabic(row.name) === key && String(row.note || "") === String(note || ""));
      if (existing) existing.qty += qty;
      else cart.push({ lineId: lineId(), name: clean, qty, special: true, note: String(note || "").trim() });
      saveCart(); animateFlight(source); if (!silent) toast("تم تسجيله كطلب خاص"); return true;
    }
    function animateFlight(source) {
      if (!source || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const badge = $("#cartBadge");
      const from = source.getBoundingClientRect();
      const to = badge?.getBoundingClientRect() || { left: window.innerWidth - 40, top: 50, width: 18, height: 18 };
      const dot = document.createElement("span");
      dot.className = "fly-item"; dot.textContent = "✓";
      dot.style.left = `${from.left + from.width / 2 - 15}px`; dot.style.top = `${from.top + from.height / 2 - 15}px`;
      dot.style.setProperty("--fly-x", `${to.left + to.width / 2 - from.left - from.width / 2}px`);
      dot.style.setProperty("--fly-y", `${to.top + to.height / 2 - from.top - from.height / 2}px`);
      document.body.append(dot); setTimeout(() => dot.remove(), 720);
    }
    function toast(message, isError = false) {
      const stack = $("#toastStack");
      const node = document.createElement("div"); node.className = `toast${isError ? " error" : ""}`; node.textContent = message;
      stack.append(node); setTimeout(() => node.remove(), 3400);
    }

      badge.classList.toggle("hidden", count === 0);
      if (count) { badge.classList.remove("bounce"); requestAnimationFrame(() => badge.classList.add("bounce")); }
    }

      return `<article class="cart-row" data-line="${escapeHTML(item.lineId)}">
        <div class="cart-row-main"><h3 class="cart-row-name">${escapeHTML(item.name || productItem?.name || "صنف")}</h3><div class="cart-row-meta">${escapeHTML(productItem?.size || "")}</div></div>
        <div class="cart-row-actions"><div class="qty-stepper"><button type="button" aria-label="تقليل الكمية" data-action="cart-qty" data-id="${escapeHTML(item.lineId)}" data-delta="-1">−</button><output>${item.qty}</output><button type="button" aria-label="زيادة الكمية" data-action="cart-qty" data-id="${escapeHTML(item.lineId)}" data-delta="1">+</button></div><button class="remove-button" type="button" aria-label="حذف الصنف" data-action="remove-line" data-id="${escapeHTML(item.lineId)}">×</button></div>
      </article>`;
    }

    function cairoParts(date = new Date()) {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(date).reduce((acc, part) => { acc[part.type] = part.value; return acc; }, {});
    }
    function dateStringFromParts(parts) { return `${parts.year}-${parts.month}-${parts.day}`; }
    function dateShift(dateText, days) {
      const [year, month, day] = dateText.split("-").map(Number);
      const shifted = new Date(Date.UTC(year, month - 1, day + days));
      return `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, "0")}-${String(shifted.getUTCDate()).padStart(2, "0")}`;
    }
    function fridayDates() {
      const parts = cairoParts();
      const today = dateStringFromParts(parts);
      const weekday = new Date(`${today}T12:00:00Z`).getUTCDay();
      const sinceFriday = (weekday - 5 + 7) % 7;
      const untilFriday = (5 - weekday + 7) % 7 || 7;
      const current = dateShift(today, -sinceFriday);
      const next = dateShift(today, untilFriday);
      return { today, weekday, isFriday: weekday === 5, current, next };
    }
    function hashSeed(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      return hash >>> 0;
    }
    function mulberry32(seed) {
      return function() {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }
    function codesForFriday(dateText) {
      const random = mulberry32(hashSeed(`${dateText}|${CONFIG.SALT}`));
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const codes = [];
      while (codes.length < 6) {
        let code = "KING-";
        for (let i = 0; i < 4; i++) code += alphabet[Math.floor(random() * alphabet.length)];
        if (!codes.includes(code)) codes.push(code);
      }
      const winnerIndex = Math.floor(random() * codes.length);
      return { date: dateText, codes, winner: codes[winnerIndex] };
    }
    function countdownText() {
      const { isFriday, next } = fridayDates();
      const [year, month, day] = next.split("-").map(Number);
      const utcGuess = Date.UTC(year, month - 1, day, 0, 0, 0);
      const localParts = cairoParts(new Date(utcGuess));
      const cairoAsUtc = Date.UTC(Number(localParts.year), Number(localParts.month) - 1, Number(localParts.day), Number(localParts.hour), Number(localParts.minute), Number(localParts.second));
      const deadline = new Date(utcGuess - (cairoAsUtc - utcGuess));
      const left = Math.max(0, deadline.getTime() - Date.now());
      const days = Math.floor(left / 86400000);
      const hours = Math.floor((left % 86400000) / 3600000);
      const minutes = Math.floor((left % 3600000) / 60000);
      const seconds = Math.floor((left % 60000) / 1000);
      const format = number => new Intl.NumberFormat("ar-EG", { minimumIntegerDigits: 2, useGrouping: false }).format(number);
      return isFriday ? "الجمعة مفتوحة الآن" : `${format(days)} يوم : ${format(hours)} ساعة : ${format(minutes)} دقيقة : ${format(seconds)} ثانية`;
    }
    function currentDiscountMessage() {
      const dates = fridayDates();
      if (!dates.isFriday || !discount || discount.date !== dates.current) return null;
      if (discount.status === "winner" && discount.code === codesForFriday(dates.current).winner) return discount;
      if (discount.status === "lucky") return discount;
      return null;
    }
    function fridayDiscountMarkup() {

      const active = currentDiscountMessage();
      const result = active ? (active.status === "winner" ? "مبروك 🎉 الكود الرابح اتسجل، والمحل هيأكد تفاصيل الخصم على الواتساب." : "حظ سعيد في كود خصم تاني 🍀") : "";
      return `<div class="discount-block">
        <div class="discount-title"><span aria-hidden="true">🎁</span><span>كود خصم الجمعة</span></div>
        <p class="discount-copy">${dates.isFriday ? "اكتب كودك للتحقق منه." : "خانة الخصم بتفتح كل جمعة 🎁"}<br><span id="fridayCountdown" class="countdown">${countdownText()}</span></p>
        <form class="discount-form" id="discountForm">
          <input id="discountInput" name="code" type="text" autocomplete="off" placeholder="KING-XXXX" aria-label="كود الجمعة" ${dates.isFriday ? "" : "disabled"} value="${active ? escapeHTML(active.code) : ""}">
          <button class="button-gold" type="submit" ${dates.isFriday ? "" : "disabled"}>تحقق</button>
        </form>

      </div>`;

    function getTopOrdered() {
      const map = new Map();
      for (const order of orders) {
        for (const item of order.items || []) {
          const key = item.special ? `special:${normalizeArabic(item.name)}` : `product:${item.productId}`;
          const existing = map.get(key) || { key, productId: item.productId || null, name: item.name, special: Boolean(item.special), times: 0, qty: 0 };
          existing.times += 1; existing.qty += Number(item.qty) || 0;
          map.set(key, existing);
        }
      }
      return [...map.values()].sort((a, b) => b.times - a.times || b.qty - a.qty);
    }

        <div class="product-info"><h3 class="product-name">${escapeHTML(name)}</h3><span class="product-size">${row.special ? "طلب خاص" : escapeHTML(category?.name || "")}</span><span class="product-size">طلبتها ${new Intl.NumberFormat("ar-EG").format(row.times)} مرة</span>

    function getWhatsappNumber() {

    function buildOrderMessage(order) {
      const lines = [
        "🛒 *طلب جديد - سوبرماركت الكينج*",
        `👤 الاسم: ${order.customer.name}`,
        `📍 العنوان: ${order.address}`,
        `🚚 الاستلام: ${order.fulfillment === "delivery" ? "توصيل" : "استلام من المحل"}`,
        "📋 *الطلب:*"
      ];
      for (const item of order.items.filter(row => !row.special)) lines.push(`- (${item.qty} × ${item.name})`);
      const specials = order.items.filter(row => row.special);
      if (specials.length) {
        lines.push("⭐ *طلبات خاصة (مش في قايمة الموقع - برجاء تأكيد التوفر):*");
        for (const item of specials) lines.push(`- (${item.qty} × ${item.name})${item.note ? ` - ${item.note}` : ""}`);
      }
      const status = order.discount?.status === "winner" ? "رابح ✅" : "غير مفعل";
      const code = order.discount?.code || "لا يوجد";
      lines.push(`🎁 كود الخصم: ${code} - ${status}`);
      if (order.notes) lines.push(`📝 ملاحظات: ${order.notes}`);
      else lines.push("📝 ملاحظات: لا توجد");
      lines.push(`🕒 رقم الطلب: ${order.id}`);

    function sendOrder(source = "cart") {
      if (!customer) { toast("سجل بياناتك الأول", true); return false; }
      if (!cart.length) { toast("العربة فاضية، اختار أصناف الأول", true); return false; }
      const address = checkout.fulfillment === "delivery" ? String(checkout.deliveryAddress || "").trim() : String(customer.address || "").trim();
      if (checkout.fulfillment === "delivery" && !address) { toast("اكتب عنوان التوصيل الأول", true); $("#deliveryAddress")?.focus(); return false; }
      if (checkout.fulfillment === "delivery") { checkout.deliveryAddress = address; writeStore(STORAGE.delivery, address); saveCheckout(); }
      const activeDiscount = currentDiscountMessage();
      const dates = fridayDates();
      const now = new Date();
      const parts = cairoParts(now);
      const id = `KING-${parts.year}${parts.month}${parts.day}-${parts.hour}${parts.minute}${parts.second}-${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
      const order = {
        id,
        createdAt: Date.now(),
        date: formatCairoDate(now),
        customer: { ...customer },
        address,
        fulfillment: checkout.fulfillment,
        recipient: checkout.recipient,
        items: cart.map(row => ({ productId: row.productId || null, name: row.name, qty: Number(row.qty) || 1, special: Boolean(row.special), note: row.note || "" })),
        notes: String(checkout.notes || "").trim(),
        discount: activeDiscount ? { code: activeDiscount.code, status: activeDiscount.status } : null,
        ownerNextCode: isOwner() ? codesForFriday(dates.next).winner : ""
      };
      const message = buildOrderMessage(order);
      const url = `https://wa.me/${getWhatsappNumber()}?text=${encodeURIComponent(message)}`;
      orders.unshift(order); orders = orders.slice(0, 150); writeStore(STORAGE.orders, orders);
      cart = []; saveCart();
      discount = null; writeStore(STORAGE.discount, null);
      const opened = window.open(url, "_blank");
      if (opened) opened.opener = null;
      else toast("تعذر فتح واتساب تلقائياً. اسمح بالنوافذ المنبثقة ثم أعد الإرسال.", true);

      } else {

        renderApp();

    function applyDiscount(code) {
      const result = $("#discountResult");
      const dates = fridayDates();
      if (!dates.isFriday) { if (result) result.textContent = "خانة الخصم بتفتح كل جمعة 🎁"; return; }
      const value = String(code || "").trim().toUpperCase().replace(/\s+/g, "");
      const pack = codesForFriday(dates.current);
      if (!pack.codes.includes(value)) { if (result) result.textContent = "كود غير صحيح"; return; }
      if (value === pack.winner) {
        const key = `king_discount_used_${dates.current}`;
        const previouslyUsed = localStorage.getItem(key) === "1";
        const alreadyActive = discount?.date === dates.current && discount?.code === value && discount?.status === "winner";
        if (previouslyUsed && !alreadyActive) { if (result) result.textContent = "الكود الرابح اتستخدم على الجهاز ده للجمعة الحالية."; return; }
        localStorage.setItem(key, "1");
        discount = { date: dates.current, code: value, status: "winner" };
        writeStore(STORAGE.discount, discount);
        if (result) result.textContent = "مبروك 🎉 الكود الرابح اتسجل، والمحل هيأكد تفاصيل الخصم على الواتساب.";
        toast("الكود الرابح اتسجل لطلبك");
      } else {
        discount = { date: dates.current, code: value, status: "lucky" };
        writeStore(STORAGE.discount, discount);
        if (result) result.textContent = "حظ سعيد في كود خصم تاني 🍀";
      }

    function renderChatMessages() {

    function isGenericSpecialRequest(text) {
      return /(حاجه مش عندكم|شي مش عندكم|صنف مش موجود|طلب تاني|طلب ثاني|عندي طلب تاني|عندي حاجه تانيه|حاجة تانية|حاجه تانيه|مش في الموقع|مش موجود في القايمه)/.test(normalizeArabic(text));
    }
    function findMentionedProducts(text) {
      const normalized = normalizeArabic(text);
      return PRODUCTS.filter(item => item.keywords.some(keyword => {
        const alias = normalizeArabic(keyword);
        return alias && normalized.includes(alias);
      }));
    }
    function isOrderIntent(text) {
      const normalized = normalizeArabic(text);
      const explicit = /(عايز|عاوزه|عاوز|محتاج|ضيف|اضف|حط|هات|اطلب|نزل|سجل|اكتبلي|جيبلي)/.test(normalized);
      const question = /(هل|عندكم|موجود|متوفر|بتبيع|فين|ازاي|مواعيد|سعر|اسعار|بكام|بكم)/.test(normalized);
      const orderShape = /(\d+\s*(?:كيلو|علبه|كرتونه|لتر)?|^(?:كيلو|كجم|علبه|كرتونه|كيس|عبوه|زجاجه)\s*)/.test(normalized);
      return explicit || (!question && (orderShape || findMentionedProducts(text).length > 0));
    }
    function cartSummary() {
      if (!cart.length) return "عربتك فاضية حالياً. قولّي الأصناف اللي محتاجها أو استخدم البحث.";
      const lines = cart.map(item => `• ${item.qty} × ${item.name}${item.special ? " (طلب خاص)" : ""}`);
      return `ملخص طلبك:\n${lines.join("\n")}\nتحب تضيف حاجة تانية؟`;
    }
    function processRemove(text) {
      const normalized = normalizeArabic(text).replace(/^(?:شيل|امسح|احذف|الغ|حذف)\s*/, "").replace(/^ال/, "").trim();
      if (!normalized) { pushBot("اكتب اسم الصنف اللي تحب أشيله من العربة."); return; }
      const before = cart.length;
      cart = cart.filter(item => !normalizeArabic(item.name).replace(/^ال/, "").includes(normalized) && !(item.productId && normalizeArabic(getProduct(item.productId)?.name || "").replace(/^ال/, "").includes(normalized)));
      if (cart.length !== before) { saveCart(); pushBot(`تمام، شلت ${normalized} من العربة.\n${cartSummary()}`); }
      else pushBot("مش لاقي الصنف ده في العربة. اكتب اسمه زي ما ظاهر عندك.");
    }
    function isPriceQuestion(text) { return /(سعر|اسعار|بكام|بكم|تكلف|فلوس)/.test(normalizeArabic(text)); }
    function knowledgeAnswer(text) {
      if (isPriceQuestion(text)) return "الأسعار بيأكدها المحل معاك على الواتساب.";
      const query = normalizeArabic(text);
      const queryTokens = query.split(" ").filter(token => token.length > 2);
      let winner = null; let highest = 0;
      for (const entry of KNOWLEDGE) {
        let score = 0;
        for (const phrase of entry.keys) {
          const normalizedPhrase = normalizeArabic(phrase);
          if (query.includes(normalizedPhrase)) score += Math.max(3, normalizedPhrase.split(" ").length * 2);
          else {
            const phraseTokens = normalizedPhrase.split(" ").filter(token => token.length > 3);
            for (const token of phraseTokens) {
              if (queryTokens.includes(token)) score += 1.1;
              else if (token.length >= 5 && queryTokens.some(q => q.length >= 5 && levenshtein(token, q) <= 1)) score += .55;
            }
          }
        }
        if (score > highest) { winner = entry; highest = score; }
      }
      return winner && highest >= 2.5 ? (typeof winner.answer === "function" ? winner.answer() : winner.answer) : null;
    }
    function orderIntentMessage(text) {
      if (isGenericSpecialRequest(text)) {

      }
      const segments = splitOrderSegments(text);
      if (!segments.length) { chatPending = { kind: "special" }; pushBot("اكتب اسم الصنف والكمية، وأنا هسجلهولك كطلب خاص."); return; }
      const added = []; const special = []; let ambiguity = null;
      for (const segment of segments) {
        const cleaned = cleanSegment(segment);
        if (!cleaned || /^(?:عايز|محتاج|ضيف|اطلب|لو سمحت)$/.test(normalizeArabic(cleaned))) continue;
        const qty = extractLeadingQuantity(cleaned);
        const result = matchProductsInSegment(cleaned);
        if (result.ambiguity) { ambiguity = { ids: result.ambiguity, qty, original: cleaned }; continue; }
        if (result.found?.length) {
          const best = result.found.sort((a, b) => b.alias.length - a.alias.length)[0];
          addRegular(best.item.id, qty, null, true);
          added.push(best.item.name);
          continue;
        }
        const specialName = stripSpecialPrefix(cleaned) || cleaned;
        if (/^(?:حاجه|شي|صنف|اي حاجه|اي شيء|منتج)$/i.test(normalizeArabic(specialName))) { chatPending = { kind: "special" }; continue; }
        if (specialName.length > 1) {
          addSpecial(specialName, qty, "", null, true);

        }
      }
      if (!added.length && !special.length && !ambiguity) { pushBot("ممكن تكتب اسم الصنف بشكل أوضح؟ أو قول: عايز حاجة مش عندكم."); return; }
      const response = [];
      if (added.length) response.push(`تمام، ضفت ${added.join("، ")} للعربة.`);
      if (special.length) response.push(`تمام ✅ سجلت ${special.join("، ")} كطلب خاص، والمحل هيأكد لك توفره على الواتساب.`);
      if (ambiguity) {
        const choices = ambiguity.ids.map(id => ({ label: getProduct(id)?.name || id, action: "ambiguous-product", value: id }));
        choices.push({ label: "غير كده - سجله طلب خاص", action: "ambiguous-special", value: ambiguity.original });
        chatPending = { kind: "ambiguity", qty: ambiguity.qty, original: ambiguity.original, ids: ambiguity.ids };
        writeStore("king_chat_pending_v1", chatPending);
        pushBot(`${response.join("\n")} تقصد أي نوع من ${ambiguity.original}؟`, choices); return;
      }
      writeStore("king_chat_pending_v1", chatPending);
      if (chatPending?.kind === "special") response.push("اكتب اسم الطلب الخاص والكمية.");
      response.push("تحب تضيف حاجة تانية؟");
      pushBot(response.join("\n"));
    }
    function processChatText(text) {
      const normalized = normalizeArabic(text);

        const parts = splitOrderSegments(text);
        const phrase = parts.length ? parts.join("، ") : text.trim();
        const qty = extractLeadingQuantity(phrase);
        const name = stripSpecialPrefix(phrase) || phrase;

        chatPending = null; removeStore("king_chat_pending_v1");
        pushBot("تمام ✅ سجلتهولك كطلب خاص، والمحل هيأكد لك توفره على الواتساب. تحب تضيف حاجة تانية؟"); return;
      }
      if (chatPending?.kind === "ambiguity") {
        const selected = chatPending.ids.map(getProduct).find(item => item && (normalizeArabic(item.name).includes(normalized) || normalized.includes(normalizeArabic(item.name))));
        if (selected) { addRegular(selected.id, chatPending.qty); chatPending = null; removeStore("king_chat_pending_v1"); pushBot(`تمام، ضفت ${selected.name} للعربة. تحب تضيف حاجة تانية؟`); return; }
      }
      if (/^(?:امسح|افرغ|فضي)\s*(?:العربه|السله|الطلب)?$/.test(normalized) || normalized.includes("امسح العربة") || normalized.includes("امسح العربه")) {

      }
      if (normalized.includes("ملخص") || normalized.includes("عربتي") || normalized.includes("طلبي")) { pushBot(cartSummary()); return; }
      if (/^(?:شيل|امسح|احذف|الغ|حذف)\s+/.test(normalized)) { processRemove(text); return; }
      if (/(?:خلاص|اكد الطلب|اكدلي الطلب|ابعت الطلب|ارسل الطلب|أكد الطلب)/.test(normalized)) {
        if (!cart.length) { pushBot("العربة فاضية. اكتب الأصناف اللي محتاجها الأول."); return; }

    window.addEventListener("hashchange", renderApp);
    window.addEventListener("storage", event => {
      if (event.key === STORAGE.cart) { cart = readStore(STORAGE.cart, []); updateCartBadge(); }
    });

    $("#yearNow").textContent = new Date().getFullYear();
    if (!checkout.deliveryAddress && customer?.address) { checkout.deliveryAddress = customer.address; saveCheckout(); }
    if (!location.hash) location.hash = "#/home";
    renderApp();
    setTimeout(() => $("#splash")?.classList.add("hide"), 720);
  </script>
</body>
</html>
