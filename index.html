  <style>
    :root {
      color-scheme: light dark;
      --tint: #1B8F4F;
      --tint-strong: #137741;
      --gold: #D9A920;
      --bg: #F2F2F7;
      --surface: #FFFFFF;
      --surface-2: #F8F8FA;
      --text: #17181A;
      --muted: #777980;
      --line: rgba(60, 60, 67, .13);
      --shadow: 0 12px 34px rgba(26, 34, 28, .08);
      --page-pad: clamp(16px, 4vw, 42px);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --nav-height: 76px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1C1C1E;
        --surface-2: #262629;
        --text: #F5F5F7;
        --muted: #A1A1A6;
        --line: rgba(235, 235, 245, .13);
        --shadow: 0 14px 38px rgba(0, 0, 0, .34);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Arabic", "IBM Plex Sans Arabic", "Cairo", sans-serif;
      overflow-x: hidden;
    }
    body.sheet-open { overflow: hidden; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--tint) 48%, transparent);
      outline-offset: 3px;
    }
    button { border: 0; cursor: pointer; }
    a { color: inherit; }
    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 22px; height: 22px; display: inline-block; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 18px; height: 18px; }
    .icon-lg { width: 28px; height: 28px; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      transition: border-color .3s var(--ease), background .3s var(--ease);
    }
    .app-header.is-scrolled { border-color: var(--line); }
    .header-inner {
      width: min(1120px, 100%);
      min-height: 72px;
      margin: auto;
      padding: 10px var(--page-pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand-lockup { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
    .brand-mark { width: 47px; height: 47px; flex: 0 0 auto; transition: width .3s var(--ease), height .3s var(--ease); }
    .is-scrolled .brand-mark { width: 40px; height: 40px; }
    .brand-copy { line-height: 1.05; display: grid; gap: 2px; }
    .brand-kicker { font-size: 10px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .brand-name { font-family: "Cairo", -apple-system, sans-serif; font-size: 21px; line-height: 1; font-weight: 900; color: var(--tint); letter-spacing: -.04em; transition: font-size .3s var(--ease); }
    .is-scrolled .brand-name { font-size: 18px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .account-button, .header-home {
      min-height: 44px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .05);
      font-size: 13px;
      font-weight: 700;
      transition: transform .18s var(--ease), background .2s;
    }
    .account-button:active, .header-home:active { transform: scale(.97); }
    .account-button .icon { color: var(--tint); }
    .desktop-nav { display: none; }
    #appMain { width: min(1120px, 100%); margin: 0 auto; padding: 22px var(--page-pad) 42px; min-height: calc(100dvh - 150px); }
    .route-view { animation: route-in .42s var(--ease) both; }
    @keyframes route-in { from { opacity: .25; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .home-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 350px;
      margin: -22px calc(var(--page-pad) * -1) 34px;
      padding: clamp(30px, 7vw, 70px) var(--page-pad);
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(170px, .8fr);
      align-items: center;
      gap: 16px;
      color: #fff;
      background: #146d3d;
      animation: hero-in .65s var(--ease) both;
    }
    @keyframes hero-in { from { opacity: .4; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .hero-copy { position: relative; z-index: 1; max-width: 560px; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 13px; color: #d6f1df; font-size: 13px; font-weight: 600; }
    .hero-eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px rgba(217,169,32,.16); }
    .home-hero h1 { margin: 0; font-family: "Cairo", -apple-system, sans-serif; font-size: clamp(36px, 8vw, 62px); line-height: 1.14; letter-spacing: -.055em; font-weight: 900; }
    .home-hero h1 span { color: #f3d36e; }
    .hero-copy p { max-width: 410px; margin: 12px 0 22px; color: rgba(255,255,255,.82); font-size: clamp(14px, 2vw, 17px); line-height: 1.8; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .button-primary, .button-light, .button-quiet, .button-outline {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform .18s var(--ease), opacity .18s, background .2s;
    }
    .button-primary:active, .button-light:active, .button-quiet:active, .button-outline:active, .round-action:active { transform: scale(.97); }
    .button-primary { color: #fff; background: var(--tint); box-shadow: 0 8px 18px rgba(27,143,79,.18); }
    .button-primary:hover { background: var(--tint-strong); }
    .button-primary:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .button-light { background: #fff; color: #145d37; }
    .button-quiet { min-height: 44px; padding: 0 14px; background: transparent; color: var(--tint); }
    .button-outline { min-height: 44px; padding: 0 15px; background: transparent; color: var(--tint); border: 1px solid var(--line); }
    .hero-art { width: min(100%, 270px); justify-self: center; animation: hero-float 5s ease-in-out infinite; }
    @keyframes hero-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .hero-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 20px 22px rgba(0,0,0,.2)); }
    .welcome-title { margin: 2px 0 18px; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.04em; font-weight: 800; }
    .welcome-title span { color: var(--tint); }
    .home-search { position: relative; margin: 20px 0 30px; }
    .search-field { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 17px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.035); }
    .search-field .icon { color: var(--muted); }
    .search-field input { flex: 1; width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 15px; }
    .search-field input::placeholder { color: var(--muted); }
    .search-clear { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--muted); }
    .search-results { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
    .search-results .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 2px 12px; color: var(--muted); font-size: 13px; }
    .search-result-list { display: grid; gap: 6px; }
    .search-result { min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 15px; text-align: right; background: transparent; }
    .search-result:hover { background: var(--surface-2); }
    .search-result .product-art { width: 52px; height: 52px; border-radius: 14px; }
    .search-result .result-copy { flex: 1; min-width: 0; }
    .search-result strong { display: block; font-size: 14px; }
    .search-result small { color: var(--muted); }
    .search-result .icon { color: var(--tint); }
    .empty-search { padding: 9px 2px 2px; line-height: 1.8; }
    .empty-search strong { display: block; margin-bottom: 3px; }
    .empty-search p { color: var(--muted); margin: 0 0 12px; font-size: 13px; }

    .section { margin: 36px 0 42px; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
    .section-heading h2, .page-heading h1 { margin: 0; font-family: "Cairo", -apple-system, sans-serif; font-size: clamp(22px, 4vw, 30px); line-height: 1.35; font-weight: 900; letter-spacing: -.045em; }
    .section-heading p, .page-heading p { margin: 5px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .text-link { padding: 7px 0; color: var(--tint); background: transparent; font-weight: 700; white-space: nowrap; }
    .category-rail { display: flex; gap: 15px; padding: 2px 2px 14px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .category-rail::-webkit-scrollbar { display: none; }
    .category-item { min-width: 76px; padding: 0; display: grid; justify-items: center; gap: 8px; background: transparent; color: var(--muted); scroll-snap-align: start; }
    .category-item .category-icon { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 19px; color: white; position: relative; overflow: hidden; background: linear-gradient(145deg, var(--cat-light), var(--cat-color) 68%, var(--cat-dark)); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 16px color-mix(in srgb, var(--cat-color) 22%, transparent); transition: transform .2s var(--ease), box-shadow .2s; }
    .category-icon::after { content: ""; position: absolute; top: -24%; left: -10%; width: 72%; height: 52%; border-radius: 50%; background: linear-gradient(130deg, rgba(255,255,255,.38), transparent); transform: rotate(-22deg); }
    .category-item .icon { width: 27px; height: 27px; position: relative; z-index: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.12)); }
    .category-item span:last-child { font-size: 12px; line-height: 1.35; text-align: center; font-weight: 600; }
    .category-item.is-active .category-icon { transform: translateY(-3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 10px 20px color-mix(in srgb, var(--cat-color) 32%, transparent); }
    .category-item.is-active span:last-child { color: var(--tint); }
    .category-item:active .category-icon { transform: scale(.96); }

    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 15px; row-gap: 23px; }
    .product-tile { position: relative; min-width: 0; padding: 0 0 12px; display: flex; flex-direction: column; text-align: right; border-bottom: 1px solid var(--line); background: transparent; }
    .product-art { --art-color: #56a96f; position: relative; width: 100%; aspect-ratio: 1 / .86; min-height: 116px; display: grid; place-items: center; overflow: hidden; border-radius: 21px; background: radial-gradient(ellipse at 50% 74%, color-mix(in srgb, var(--art-color) 17%, white), color-mix(in srgb, var(--art-color) 7%, var(--surface-2)) 60%, var(--surface-2)); }
    .product-art::before { content: ""; position: absolute; width: 56%; height: 8%; bottom: 11%; left: 22%; border-radius: 50%; background: color-mix(in srgb, var(--art-color) 20%, transparent); filter: blur(8px); }
    .product-art svg { position: relative; z-index: 1; width: 88%; height: 88%; overflow: visible; }
    .product-art img { width: 100%; height: 100%; object-fit: cover; }
    .product-art.art-large { width: min(100%, 280px); margin: 0 auto; border-radius: 30px; }
    .product-art.art-small { width: 54px; height: 54px; min-height: 0; border-radius: 15px; flex: 0 0 auto; }
    .product-art.art-small svg { width: 92%; height: 92%; }
    .tile-favorite { position: absolute; z-index: 2; inset-block-start: 9px; inset-inline-start: 9px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(12px); }
    .tile-favorite.is-favorite { color: #de5872; }
    .tile-favorite.is-favorite svg { fill: currentColor; }
    .product-name { margin: 11px 2px 2px; font-size: 15px; line-height: 1.45; font-weight: 700; }
    .product-unit { margin: 0 2px 9px; color: var(--muted); font-size: 12px; }
    .tile-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
    .round-action { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--tint); transition: transform .18s var(--ease), background .2s; }
    .round-action:hover { background: var(--tint-strong); }
    .qty-control { min-height: 42px; display: inline-flex; align-items: center; gap: 12px; padding: 3px 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
    .qty-control button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--tint); background: var(--surface-2); }
    .qty-control output { min-width: 18px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
    .product-open { position: relative; inset: auto; z-index: 1; width: 100%; padding: 0; display: block; color: inherit; text-align: right; background: transparent; }
    .product-tile .product-art { z-index: auto; }
    .product-tile .tile-bottom { position: relative; z-index: 2; }
    .product-name, .product-unit { pointer-events: none; }
    .top-picks .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .popular-custom { min-height: 224px; padding: 17px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); }
    .popular-custom .special-glyph { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 22px; color: #9a750e; background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
    .popular-custom strong { font-size: 15px; }
    .popular-custom small { color: var(--muted); font-size: 12px; }
    .popular-custom .round-action { margin-top: auto; align-self: flex-end; }
    .catalog-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0; }
    .catalog-controls p { margin: 0; color: var(--muted); font-size: 13px; }
    .catalog-count { white-space: nowrap; }

    .benefits { display: grid; grid-template-columns: 1fr; border-radius: 22px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
    .benefit-row { min-height: 74px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .benefit-row + .benefit-row { border-top: 1px solid var(--line); }
    .benefit-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: var(--tint); background: color-mix(in srgb, var(--tint) 10%, var(--surface)); }
    .benefit-row strong { display: block; font-size: 14px; }
    .benefit-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .friday-inline { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 35px 0; padding: 18px 20px; border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); border-radius: 22px; background: color-mix(in srgb, var(--gold) 9%, var(--surface)); }
    .friday-inline strong { display: block; }
    .friday-inline p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .gold-icon { color: var(--gold); }

    .page-heading { margin: 10px 0 24px; }
    .page-heading h1 { font-size: clamp(28px, 6vw, 40px); }
    .segmented { width: 100%; display: flex; gap: 3px; padding: 4px; border-radius: 15px; background: color-mix(in srgb, var(--muted) 10%, var(--surface)); }
    .segmented button { flex: 1; min-height: 42px; padding: 5px 9px; border-radius: 11px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 700; transition: background .2s, color .2s, box-shadow .2s; }
    .segmented button.is-active { color: var(--text); background: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.09); }
    .popular-segment { margin: 0 0 23px; }
    .popular-segment button { font-size: 12px; }
    .request-count { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
    .history-list { display: grid; gap: 12px; }
    .history-item { padding: 17px; border-radius: 21px; background: var(--surface); border: 1px solid var(--line); }
    .history-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .history-top strong { font-size: 15px; }
    .history-top time, .history-meta { color: var(--muted); font-size: 12px; }
    .history-products { margin: 12px 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .history-item .button-outline { min-height: 40px; }

    .empty-state { min-height: 310px; display: grid; align-content: center; justify-items: center; padding: 32px 18px; text-align: center; }
    .empty-illustration { width: 126px; height: 126px; margin-bottom: 16px; display: grid; place-items: center; border-radius: 38px; color: var(--tint); background: color-mix(in srgb, var(--tint) 9%, var(--surface)); }
    .empty-illustration svg { width: 58px; height: 58px; stroke-width: 1.35; }
    .empty-state h2 { margin: 0 0 6px; font-family: "Cairo", sans-serif; font-size: 21px; font-weight: 800; }
    .empty-state p { max-width: 330px; margin: 0 0 16px; color: var(--muted); line-height: 1.8; font-size: 14px; }

    .grouped-section { margin: 22px 0; }
    .grouped-title { margin: 0 12px 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .grouped-list { overflow: hidden; border-radius: 21px; background: var(--surface); border: 1px solid var(--line); }
    .grouped-row { min-height: 66px; display: flex; align-items: center; gap: 12px; padding: 12px 15px; }
    .grouped-row + .grouped-row { border-top: 1px solid var(--line); }
    .grouped-row .row-icon { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; color: var(--tint); background: color-mix(in srgb, var(--tint) 9%, var(--surface)); }
    .grouped-row .row-main { min-width: 0; flex: 1; }
    .grouped-row .row-main strong { display: block; font-size: 14px; line-height: 1.5; }

        const deliveryAddress = state.deliveryAddress.trim() || $("#deliveryAddress")?.value.trim() || state.profile.address;
        if (state.fulfillment === "delivery" && !deliveryAddress) {
          showBanner("اكتب عنوان التوصيل قبل إرسال الطلب.", "error", "location");
          $("#deliveryAddress")?.focus();
          return;
        }
        if (deliveryAddress && state.fulfillment === "delivery") {
          state.profile.address = deliveryAddress;
          state.deliveryAddress = deliveryAddress;
          writeStore(STORAGE.profile, state.profile);
        }
        const now = new Date();
        const id = `K-${now.getTime().toString(36).toUpperCase()}`;
        const order = {
          id,
          createdAt: now.toISOString(),
          name: state.profile.name,
          address: state.fulfillment === "delivery" ? deliveryAddress : state.profile.address,
          fulfillment: state.fulfillment,
          partner: state.partner,
          items: PRODUCTS.filter(product => Number(state.cart.items[product.id]) > 0).map(product => ({ id: product.id, name: product.name, qty: Number(state.cart.items[product.id]), unit: product.unit })),
          custom: state.cart.custom.map(item => ({ name: item.name, qty: Number(item.qty), note: item.note || "", unit: item.unit || "صنف" })),
          notes: state.orderNotes.trim() || $("#orderNotes")?.value.trim() || ""
        };
        if (profileIsOwner()) order.ownerCode = nextFridayPack().winner;
        const number = CONFIG.WHATSAPP[state.partner] || CONFIG.WHATSAPP.quarter;
        const message = makeOrderMessage(order);
        state.orders.unshift(order);
        state.orders = state.orders.slice(0, 60);
        writeStore(STORAGE.orders, state.orders);
        state.cart = { items: {}, custom: [] };
        saveCart(); updateCartBadge();
        state.orderNotes = "";
        state.coupon = null; state.couponDraft = ""; writeStore(STORAGE.coupon, null);
        state.couponFeedback = ""; state.couponFeedbackType = "";
        renderRoute();
        showBanner("طلبك اتسجل في سجل الطلبات، جاري فتح واتساب لإرساله.", "success", "check");
        openWhatsApp(number, message);
      }
      function repeatOrder(orderId) {
        const order = state.orders.find(item => item.id === orderId);
        if (!order) return;
        for (const item of order.items || []) if (productById(item.id)) addProductToCart(item.id, item.qty, { silent: true });
        for (const item of order.custom || []) addCustomToCart(item.name, item.qty, item.note || "طلب خاص مكرر");
        saveCart(); updateCartBadge();
        showBanner("اتضافت أصناف الطلب السابق للعربة.", "success", "check");
        navigate("cart");
      }
      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
          else {
            const area = document.createElement("textarea"); area.value = text; area.style.position = "fixed"; area.style.opacity = "0"; document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
          }
          showBanner("تم نسخ الكود.", "success", "check");
        } catch (error) { showBanner("تعذر النسخ تلقائياً. اضغط مطولاً على الكود لنسخه.", "error", "copy"); }
      }
      function waFromChat() {
        const recipient = CONFIG.WHATSAPP[state.partner] || CONFIG.WHATSAPP.quarter;
        const message = "أهلاً، محتاج مساعدة في طلب من سوبرماركت الكينج.";
        openWhatsApp(recipient, message);
      }

      function handleClick(event) {
        if (event.target.matches("[data-sheet-backdrop]")) { closeSheet(); return; }
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;
        const id = button.dataset.id || "";
        if (action === "navigate") { navigate(button.dataset.route); return; }
        if (action === "open-account") { openAccountSheet(); return; }
        if (action === "open-profile") { openProfileSheet(); return; }
        if (action === "owner-panel") { openOwnerPanel(); return; }
        if (action === "close-sheet") { closeSheet(); return; }
        if (action === "open-special") { openSpecialSheet(button.dataset.name || ""); return; }
        if (action === "show-product") { openProductSheet(id); return; }
        if (action === "add-product") { addProductToCart(id, 1); return; }
        if (action === "change-cart") {
          updateCartProduct(id, Number(button.dataset.delta) || 0);
          if (["cart", "home", "popular"].includes(state.route)) renderRoute();
          return;
        }
        if (action === "toggle-favorite") {
          if (state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
          writeStore(STORAGE.favorites, [...state.favorites]);
          renderRoute();
          announce(state.favorites.has(id) ? "أضيف للمفضلة" : "أزيل من المفضلة");
          return;
        }
        if (action === "select-category") {
          state.currentCategory = id;
          state.searchQuery = "";
          renderRoute();
          if (id) window.setTimeout(() => $("#products")?.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
          return;
        }
        if (action === "clear-search") {
          state.searchQuery = "";
          renderRoute();
          $("#searchInput")?.focus();
          return;
        }
        if (action === "scroll-products") { $("#products")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
        if (action === "popular-mode") { state.popularMode = button.dataset.mode || "top"; renderRoute(); return; }
        if (action === "add-custom") {
          addCustomToCart(button.dataset.name || "", 1, "طلب خاص من الأكثر طلباً");
          renderRoute(); showBanner("اتضاف الطلب الخاص للعربة.", "success", "check"); return;
        }
        if (action === "delete-item") {
          removeProductFromCart(id); renderRoute(); showBanner("اتشال الصنف من العربة.", "success", "trash"); return;
        }
        if (action === "change-custom") {
          updateCustomQuantity(id, Number(button.dataset.delta) || 0); renderRoute(); return;
        }
        if (action === "delete-custom") {
          removeCustom(id); renderRoute(); showBanner("اتشال الطلب الخاص من العربة.", "success", "trash"); return;
        }
        if (action === "edit-custom") { openSpecialSheet("", id); return; }
        if (action === "fulfillment") { state.fulfillment = button.dataset.mode === "delivery" ? "delivery" : "pickup"; renderRoute(); return; }
        if (action === "select-partner") { state.partner = id === "dosouqi" ? "dosouqi" : "quarter"; renderRoute(); return; }
        if (action === "apply-coupon") { applyCoupon(); return; }
        if (action === "submit-order") { submitOrder(); return; }
        if (action === "repeat-order") { repeatOrder(id); return; }
        if (action === "detail-qty") {
          const output = $("#detailQuantity");
          if (output) output.textContent = formatQuantity(Math.max(1, (Number(normalizeDigits(output.textContent)) || 1) + (Number(button.dataset.delta) || 0)));
          vibrate(); return;
        }
        if (action === "detail-add") {
          const quantity = Number(normalizeDigits($("#detailQuantity")?.textContent)) || 1;
          addProductToCart(id, quantity, { silent: true });
          closeSheet(); renderRoute(); showBanner(`${productById(id)?.name || "الصنف"} اتضاف للعربة.`, "success", "check"); return;
        }
        if (action === "toggle-vibrate") {
          state.preferences.vibrate = !state.preferences.vibrate;
          writeStore(STORAGE.preferences, state.preferences);
          button.setAttribute("aria-checked", String(state.preferences.vibrate));
          if (state.preferences.vibrate && "vibrate" in navigator) { try { navigator.vibrate(12); } catch (error) { /* optional */ } }
          return;
        }
        if (action === "logout") {
          state.profile = null; removeStore(STORAGE.profile); closeSheet(); updateAccountButton();
          showBanner("تم تسجيل الخروج من هذا الجهاز.", "success", "check"); renderRoute(); return;
        }
        if (action === "copy-code") { copyText(button.dataset.code || ""); return; }
        if (action === "send-suggestion") { sendAssistantMessage(button.dataset.text || ""); return; }
        if (action === "new-chat") {
          if (state.voiceRecognition) { try { state.voiceRecognition.stop(); } catch (error) { /* already stopped */ } }
          state.chat = []; state.chatTyping = false; removeStore(STORAGE.chat); renderRoute(); showBanner("بدأنا محادثة جديدة.", "success", "assistant"); return;
        }
        if (action === "voice-input") { startVoiceInput(); return; }
        if (action === "add-recipe") { addRecipeToCart(button.dataset.recipe || ""); return; }
        if (action === "chat-contact") { waFromChat(); return; }
      }
      function handleSubmit(event) {
        const form = event.target;
        if (form.id === "profileForm") {
          event.preventDefault();
          const data = new FormData(form);
          const name = String(data.get("name") || "").trim();
          const address = String(data.get("address") || "").trim();
          if (!name || !address) { showBanner("الاسم والعنوان مطلوبان.", "error", "person"); return; }
          state.profile = { name: name.slice(0, 60), address: address.slice(0, 180) };
          state.deliveryAddress = state.profile.address;
          writeStore(STORAGE.profile, state.profile);
          updateAccountButton();
          closeSheet(); renderRoute();
          showBanner("اتحفظت بياناتك، تقدر تكمل طلبك.", "success", "check");
          return;
        }
        if (form.id === "specialForm") {
          event.preventDefault();
          const data = new FormData(form);
          const name = String(data.get("name") || "").trim();
          const quantity = Number(data.get("qty"));
          const note = String(data.get("note") || "").trim();
          if (!name || !Number.isFinite(quantity) || quantity <= 0) { showBanner("اكتب اسم الصنف والكمية بشكل صحيح.", "error", "close"); return; }
          addCustomToCart(name, quantity, note, form.dataset.editId || "");
          closeSheet(); renderRoute();
          showBanner(form.dataset.editId ? "اتحفظ تعديل الطلب الخاص." : "اتضاف الطلب الخاص للعربة.", "success", "check");
          return;
        }
        if (form.id === "chatForm") {
          event.preventDefault();
          const input = $("#chatInput");
          const text = input?.value || "";
          if (input) input.value = "";
          sendAssistantMessage(text);
        }
      }
      function updateSearchView(value) {
        state.searchQuery = value;
        const results = $("#searchResults");
        if (results) results.innerHTML = renderSearchResults(value);
        const clearSlot = $("#searchClearSlot");
        if (clearSlot) clearSlot.innerHTML = value ? `<button class="search-clear" type="button" data-action="clear-search" aria-label="مسح البحث">${icon("close", "icon-sm")}</button>` : "";
        const catalog = $("#catalogResults");
        if (catalog && state.catalogLoaded) catalog.innerHTML = productGrid(currentHomeProducts());
        const count = $(".catalog-count");
        if (count) count.textContent = `${formatQuantity(currentHomeProducts().length)} صنف`;
      }
      function handleInput(event) {
        if (event.target.id === "searchInput") { updateSearchView(event.target.value); return; }
        if (event.target.id === "couponInput") { event.target.value = event.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 9); state.couponDraft = event.target.value; return; }
        if (event.target.id === "deliveryAddress") { state.deliveryAddress = event.target.value; return; }
        if (event.target.id === "orderNotes") { state.orderNotes = event.target.value; return; }
        if (event.target.id === "chatInput") {
          event.target.style.height = "auto";
          event.target.style.height = `${Math.min(event.target.scrollHeight, 116)}px`;
        }
      }
      function handleKeydown(event) {
        if (event.key === "Escape" && $(".sheet-backdrop")) { closeSheet(); return; }
        if (event.target.id === "chatInput" && event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          const text = event.target.value;
          event.target.value = ""; event.target.style.height = "42px";
          sendAssistantMessage(text);
        }
      }
      let touchStartX = 0;
      let touchedCartRow = null;
      function handleTouchStart(event) {
        const row = event.target.closest("[data-swipe-row]");
        if (!row || !event.touches?.length) return;
        touchStartX = event.touches[0].clientX;
        touchedCartRow = row;
      }
      function handleTouchEnd(event) {
        if (!touchedCartRow || !event.changedTouches?.length) return;
        const deltaX = event.changedTouches[0].clientX - touchStartX;
        if (deltaX < -55) {
          $$("[data-swipe-row].is-revealed").forEach(row => row.classList.remove("is-revealed"));
          touchedCartRow.classList.add("is-revealed");
        } else if (deltaX > 55) touchedCartRow.classList.remove("is-revealed");
        touchedCartRow = null;
      }
      function bindSheetGestures() {
        const root = $("#sheetRoot");
        let startY = null;
        root?.addEventListener("pointerdown", event => {
          if (!event.target.closest("[data-sheet-grabber]")) return;
          startY = event.clientY;
        });
        root?.addEventListener("pointerup", event => {
          if (startY === null) return;
          if (event.clientY - startY > 85) closeSheet();
          startY = null;
        });
        root?.addEventListener("pointercancel", () => { startY = null; });
      }
      function init() {
        if (!location.hash) history.replaceState(null, "", "#home");
        renderRoute();
        document.addEventListener("click", handleClick);
        document.addEventListener("submit", handleSubmit);
        document.addEventListener("input", handleInput);
        document.addEventListener("keydown", handleKeydown);
        document.addEventListener("touchstart", handleTouchStart, { passive: true });
        document.addEventListener("touchend", handleTouchEnd, { passive: true });
        bindSheetGestures();
        window.addEventListener("hashchange", () => {
          const next = (location.hash || "#home").replace("#", "");
          state.route = ["home", "popular", "assistant", "cart"].includes(next) ? next : "home";
          renderRoute();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        window.addEventListener("scroll", () => $("#appHeader")?.classList.toggle("is-scrolled", window.scrollY > 12), { passive: true });
        window.setInterval(() => updateCountdownLabels(), 1000);
      }
      init();

    })();
  </script>
</body>
</html>
